name: Automated News Videos

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout Repo
        uses: actions/checkout@v3

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install system dependency ffmpeg
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Install Python dependencies including imageio-ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Test MoviePy
      - name: Test MoviePy
        run: python -c "from moviepy.editor import VideoFileClip; print('MoviePy OK')"

      # Run pipeline
      - name: Run News Video Pipeline
        run: python run_pipeline.py
