name: Automated News Videos

# Trigger every hour + manual trigger
on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repo
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install system dependencies (ffmpeg for MoviePy)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libav-tools

      # Step 4: Install Python dependencies
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Test MoviePy installation
      - name: Test MoviePy
        run: python -c "from moviepy.editor import VideoFileClip; print('MoviePy OK')"

      # Step 6: Run the news video pipeline
      - name: Run News Video Pipeline
        run: python run_pipeline.py
